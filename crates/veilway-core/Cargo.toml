[package]
name="veilway-core"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
publish.workspace=true

[features]
# The stream listener over pipes in memory, for the fuzz target and the crate's own tests. No build of a node turns it on.
bench=["veilway-proto/bench"]

[dependencies]
veilway-wg={path="../veilway-wg"}
veilway-proto={path="../veilway-proto"}
tokio.workspace=true
anyhow.workspace=true
serde.workspace=true
serde_json={workspace=true, features=["raw_value"]}
tracing.workspace=true
ipstack.workspace=true
tokio-socks.workspace=true
ipnet.workspace=true
etherparse.workspace=true
base64.workspace=true
schemars.workspace=true
time.workspace=true
ring.workspace=true
socket2.workspace=true
# The `tls` transport: the node ends TLS itself, with the library the built `ws` already ends it with.
tokio-rustls.workspace=true
rustls.workspace=true
# The client side of the native transports, which a node link this node dials is opened with, and the root certificates its TLS is validated against when no other roots are given.
veilway-transport={path="../veilway-transport"}
webpki-roots.workspace=true

# The one ioctl that makes the TUN device of an l3 exit on Linux, and the flags the state file is opened with.
[target.'cfg(unix)'.dependencies]
libc.workspace=true

# The socket option that prohibits fragmentation of what a datagram transport of a `veilway` inbound sends: `socket2` has no setter for it, and this one needs no `unsafe` of ours.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace=true

[dev-dependencies]
# The crate's own tests are built with the listener over pipes in memory.
veilway-core={path=".", features=["bench"]}
boringtun.workspace=true
# The tests of `udp-obfs` read the node's log: a state in which honest clients are refused has to be said.
tracing-subscriber.workspace=true
# The tests of `tls`: a certificate made for each test, and a real HTTP/1.1 server as the decoy origin that the node is held against.
rcgen.workspace=true
hyper.workspace=true
hyper-util.workspace=true
http-body-util.workspace=true
# The tests of the proxy path wait five minutes for a connection to be given up, on a clock that is paused and moved for them.
tokio={workspace=true, features=["test-util"]}
