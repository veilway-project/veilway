[package]
name="veilway-core"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
publish.workspace=true

[dependencies]
veilway-wg={path="../veilway-wg"}
veilway-proto={path="../veilway-proto"}
tokio.workspace=true
anyhow.workspace=true
serde.workspace=true
serde_json={workspace=true, features=["raw_value"]}
tracing.workspace=true
ipstack.workspace=true
tokio-socks.workspace=true
ipnet.workspace=true
etherparse.workspace=true
base64.workspace=true
schemars.workspace=true
time.workspace=true
ring.workspace=true
socket2.workspace=true

# The one ioctl that makes the TUN device of an l3 exit on Linux, and the flags the state file is opened with.
[target.'cfg(unix)'.dependencies]
libc.workspace=true

# The socket option that prohibits fragmentation of what a datagram transport of a `veilway` inbound sends: `socket2` has no setter for it, and this one needs no `unsafe` of ours.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace=true

[dev-dependencies]
boringtun.workspace=true
# The tests of `udp-obfs` read the node's log: a state in which honest clients are refused has to be said.
tracing-subscriber.workspace=true
