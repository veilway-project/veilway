[package]
name="veilway-core"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
description="Veilway node engine: config v1, routing, quotas, userspace TCP/IP exits and the native transports."
readme="README.md"
keywords=["vpn", "wireguard", "proxy", "server", "censorship"]
categories=["network-programming"]
exclude=["tests/", "examples/", "proptest-regressions/"]

[features]
# The stream listener over pipes in memory, for the fuzz target and the crate's own tests. No build of a node turns it on.
bench=["veilway-proto/bench"]
# Where the addresses of a provider's profile really are, for the tests of the upstreams: a profile cannot name loopback, so a test says where its documents' addresses lead. No build of a node turns it on.
upstream-tests=["veilway-engine/testing"]

[dependencies]
veilway-wg={path="../veilway-wg", version="0.3.5"}
veilway-proto={path="../veilway-proto", version="0.3.5"}
tokio.workspace=true
anyhow.workspace=true
serde.workspace=true
serde_json={workspace=true, features=["raw_value"]}
tracing.workspace=true
ipstack.workspace=true
ipnet.workspace=true
etherparse.workspace=true
smoltcp.workspace=true
base64.workspace=true
schemars.workspace=true
time.workspace=true
ring.workspace=true
sha2="0.11"
socket2.workspace=true
# The `tls` transport: the node ends TLS itself, with the library the built `ws` already ends it with.
tokio-rustls.workspace=true
rustls.workspace=true
# The client side of the native transports, which a node link this node dials is opened with, and the root certificates its TLS is validated against when no other roots are given.
veilway-transport={path="../veilway-transport", version="0.3.5"}
# The client engine runs inside the node as the carrier of an upstream (another provider's subscription used as an exit). Without its `testing` and `unencrypted-vault` features: the dev-dependency below turns them on for tests alone, and a release build of the engine refuses them.
veilway-engine={path="../veilway-engine", version="0.3.5"}
webpki-roots.workspace=true
# The self-signed certificate of a `tls` transport with `self_signed`: made with rcgen, whose crates the tree already has, and read back with x509-parser, which the binary already links, for the name it keeps and the dates it is renewed by.
rcgen.workspace=true
x509-parser.workspace=true
# The WireGuard outbounds: the node is a client of another server, with one tunnel from boringtun for each, and reads the public key of its own from `veilway-wg`.
boringtun.workspace=true

# The one ioctl that makes the TUN device of an l3 exit on Linux, and the flags the state file is opened with.
[target.'cfg(unix)'.dependencies]
libc.workspace=true

# The socket option that prohibits fragmentation of what a datagram transport of a `veilway` inbound sends: `socket2` has no setter for it, and this one needs no `unsafe` of ours.
[target.'cfg(target_os = "linux")'.dependencies]
rustix.workspace=true

[dev-dependencies]
# The client engine runs against the node in tests/engine.rs.
veilway-engine={path="../veilway-engine", features=["testing", "unencrypted-vault"]}
# The crate's own tests are built with the listener over pipes in memory.
veilway-core={path=".", features=["bench", "upstream-tests"]}
# The tests of `udp-obfs` read the node's log: a state in which honest clients are refused has to be said.
tracing-subscriber.workspace=true
# The tests of `tls`: a real HTTP/1.1 server as the decoy origin that the node is held against. Their certificates are made with rcgen, a dependency of the crate itself.
hyper.workspace=true
hyper-util.workspace=true
http-body-util.workspace=true
# The tests of the proxy path wait five minutes for a connection to be given up, on a clock that is paused and moved for them.
tokio={workspace=true, features=["test-util"]}

# The tests of management run the control API on both nodes of a link. The API depends on this crate, which a dependency of a dev-dependency may do when it has no version: the manifest sent to the registry leaves it out.
[target.'cfg(unix)'.dev-dependencies]
veilway-api={path="../veilway-api"}
