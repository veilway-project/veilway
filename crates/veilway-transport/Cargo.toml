[package]
name="veilway-transport"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
description="Client side of the Veilway transports: udp-obfs, tls, ws, fronted and faketls, carrying WireGuard datagrams to a node."
readme="README.md"
keywords=["vpn", "wireguard", "tls", "obfuscation", "censorship"]
categories=["network-programming", "cryptography"]
exclude=["tests/", "examples/", "proptest-regressions/"]

[dependencies]
veilway-proto={path="../veilway-proto", version="0.3.3"}
tokio.workspace=true
# The handshake of `tls`, `ws` and `fronted` is BoringSSL's, configured as Chrome's (`fingerprint.rs`). rustls stays for the certificate checks (`tls.rs`), which are the same as the node's and the subscription page's.
boring={version="5.3", default-features=false}
tokio-boring="5.3"
# The library's reason codes (`tls.rs`), and `SSL_get_shutdown` on a shared reference (`fingerprint.rs`), which `boring` offers only on `&mut`.
boring-sys.workspace=true
foreign-types="0.5"
# A server may send its chain compressed, as Chrome offers.
brotli={version="9", default-features=false, features=["std"]}
rustls.workspace=true
# SHA-256 of a certificate's SubjectPublicKeyInfo for the pins, and the system's random source. No cryptography is written here.
ring.workspace=true
# The key share `X` of a `faketls` hello, as a plain function over the bytes the client drew, and the public key of the leaf the node answers with (`faketls.rs`).
x25519-dalek.workspace=true
x509-parser.workspace=true
# The comparison of the leaf's key with the one the client derives takes the same time wherever the two differ.
subtle.workspace=true
# The seed and the private key of the ML-KEM share are wiped when they are done with.
zeroize.workspace=true
base64.workspace=true
tracing.workspace=true

# The caller's hook is handed every socket before it is connected, as a reference of this crate's type.
socket2.workspace=true

# The socket option that prohibits fragmentation of what `udp-obfs` sends, the one the node sets.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix.workspace=true

[dev-dependencies]
tokio-rustls.workspace=true
# Certificates made for each test of what the client accepts and refuses.
rcgen.workspace=true
# The validity times of those certificates.
time.workspace=true
tokio={workspace=true, features=["test-util"]}
