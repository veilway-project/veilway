[package]
name="veilway-transport"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
publish.workspace=true

[dependencies]
veilway-proto={path="../veilway-proto"}
tokio.workspace=true
# The handshake of `tls`, `ws` and `fronted` is BoringSSL's, configured as Chrome's (`fingerprint.rs`). rustls stays for the certificate checks (`tls.rs`), which are the same as the node's and the subscription page's.
boring={version="5.3", default-features=false}
tokio-boring="5.3"
# The ALPS setting has no safe call in `boring`, and Chrome's JA4 has the extension.
boring-sys="5.3"
foreign-types="0.5"
# A server may send its chain compressed, as Chrome offers.
brotli={version="9", default-features=false, features=["std"]}
rustls.workspace=true
# SHA-256 of a certificate's SubjectPublicKeyInfo for the pins, and the system's random source. No cryptography is written here.
ring.workspace=true
base64.workspace=true
tracing.workspace=true

# The caller's hook is handed every socket before it is connected, as a reference of this crate's type.
socket2.workspace=true

# The socket option that prohibits fragmentation of what `udp-obfs` sends, the one the node sets.
[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
rustix.workspace=true

[dev-dependencies]
tokio-rustls.workspace=true
# Certificates made for each test of what the client accepts and refuses.
rcgen.workspace=true
# The validity times of those certificates.
time.workspace=true
tokio={workspace=true, features=["test-util"]}
