[package]
name="veilway-engine"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
description="Veilway client engine without an OS layer: candidate race, session carrying, subscription import and status."
readme="README.md"
keywords=["vpn", "wireguard", "client", "censorship", "proxy"]
categories=["network-programming"]
exclude=["tests/", "examples/", "proptest-regressions/"]

[features]
# Hooks that exist for tests: where a dial goes after its checks, and how a wait is made. No build that ships turns it on.
testing=[]
# A vault in a plain file with the secrets in it. For tests, and for nothing that ships: the platform supplies a `Vault` that keeps them in its secret storage.
unencrypted-vault=[]
# The readers of bytes from the node, public for the fuzz targets.
fuzz=[]

[lints.rust]
unexpected_cfgs={level="warn", check-cfg=["cfg(fuzzing)", "cfg(veilway_release_tests)"]}

[dependencies]
veilway-proto={path="../veilway-proto", version="0.3.10"}
veilway-transport={path="../veilway-transport", version="0.3.10"}
tokio.workspace=true
tracing.workspace=true
# WireGuard itself, unchanged: one `Tunn` for the one node a tunnel talks to.
boringtun.workspace=true
# The saved state and the stored subscriptions are small JSON files that are read back as hostile input.
serde.workspace=true
serde_json.workspace=true
base64.workspace=true
# The system's random source, and the SHA-256 that names a network in the saved state without keeping its name.
ring.workspace=true
# TLS of the subscription fetch, with the library the transports use, and the certificate roots it is validated against by default.
tokio-rustls.workspace=true
rustls.workspace=true
webpki-roots.workspace=true
# The hook the caller hands every socket to is a reference of this crate's type.
socket2.workspace=true
# The Xray carrier (`xray`): the userspace stack the device's packets enter, and the packets it writes for itself (echo replies, resets, unreachable errors).
ipstack.workspace=true
etherparse.workspace=true
# The local proxy's userspace TCP/IP stack, which takes over a tunnel's packet interface.
smoltcp.workspace=true

[dev-dependencies]
proptest.workspace=true
tokio={workspace=true, features=["test-util"]}
