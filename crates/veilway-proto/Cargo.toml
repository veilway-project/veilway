[package]
name="veilway-proto"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
description="Wire formats of the Veilway native protocol: keys, chunks, control channel, subscriptions. Pure code, no IO."
readme="README.md"
keywords=["vpn", "protocol", "wireguard", "censorship", "proxy"]
categories=["network-programming", "cryptography", "encoding"]
exclude=["tests/", "examples/", "proptest-regressions/"]

[features]
# A way to seal a chunk no client would send, for the tests of what a receiver does with one. No build of a node turns it on.
bench=[]

[dependencies]
ring.workspace=true
hpke.workspace=true
subtle.workspace=true
# The key agreement of a node link's pairing. `ring` agrees only with a private key it drew itself, and this crate draws nothing.
x25519-dalek.workspace=true
# The P-256 key of a `faketls` leaf: `ring` takes a scalar only inside a key pair it has checked, so the public point is multiplied here. BoringSSL is the library the transports already build.
boring={version="5.3", default-features=false}
base64.workspace=true
argon2.workspace=true
fluke-hpack.workspace=true
serde.workspace=true
serde_json.workspace=true

[dev-dependencies]
proptest.workspace=true
# The tests seal what no client or gateway would, which `bench` allows.
veilway-proto={path=".", features=["bench"]}

# cargo-fuzz builds with this cfg. `proof` and `udp_obfs` then offer a way to seal what no client would, so that a fuzzer reaches the code behind their cryptographic checks.
[lints.rust]
unexpected_cfgs={level="warn", check-cfg=["cfg(fuzzing)"]}
