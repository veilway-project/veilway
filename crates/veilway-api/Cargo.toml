[package]
name="veilway-api"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
description="Control API of a Veilway node: HTTP and JSON on a unix socket, with an OpenAPI document."
readme="README.md"
keywords=["vpn", "api", "openapi", "axum", "control"]
categories=["network-programming", "web-programming"]
exclude=["tests/", "examples/", "proptest-regressions/"]

# The control API is served on a unix socket and nowhere else, so on other systems this crate is empty.
[target.'cfg(unix)'.dependencies]
veilway-core={path="../veilway-core", version="0.3.10"}
tokio.workspace=true
serde.workspace=true
serde_json.workspace=true
schemars.workspace=true
tracing.workspace=true
time.workspace=true
futures-util.workspace=true
ring.workspace=true
axum.workspace=true
# The client is what `held` asks a node that already runs with, and what the tests talk to the socket with.
hyper={workspace=true, features=["client"]}
hyper-util.workspace=true
socket2.workspace=true

[target.'cfg(unix)'.dev-dependencies]
veilway-wg={path="../veilway-wg", version="0.3.10"}
veilway-proto={path="../veilway-proto", version="0.3.10"}
boringtun.workspace=true
etherparse.workspace=true
tracing-subscriber.workspace=true
# The tests of the upstream routes are served by a provider of their own: a TLS endpoint that opens the sealed requests of the node and signs its answers.
rcgen.workspace=true
rustls.workspace=true
tokio-rustls.workspace=true
base64.workspace=true
