[package]
name="veilway-api"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
publish.workspace=true

# The control API is served on a unix socket and nowhere else, so on other systems this crate is empty.
[target.'cfg(unix)'.dependencies]
veilway-core={path="../veilway-core"}
tokio.workspace=true
serde.workspace=true
serde_json.workspace=true
schemars.workspace=true
tracing.workspace=true
time.workspace=true
futures-util.workspace=true
axum.workspace=true
# The client is what `held` asks a node that already runs with, and what the tests talk to the socket with.
hyper={workspace=true, features=["client"]}
hyper-util.workspace=true
socket2.workspace=true

[target.'cfg(unix)'.dev-dependencies]
veilway-wg={path="../veilway-wg"}
veilway-proto={path="../veilway-proto"}
boringtun.workspace=true
etherparse.workspace=true
tracing-subscriber.workspace=true
