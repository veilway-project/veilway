[package]
name="veilway-macos"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
description="macOS layer of the Veilway client: utun, routing socket, pf kill switch, DNS and keychain vault."
readme="README.md"
keywords=["vpn", "macos", "utun", "pf", "keychain"]
categories=["network-programming", "os::macos-apis"]
exclude=["tests/", "examples/", "proptest-regressions/"]

[dependencies]
veilway-engine={path="../veilway-engine", version="0.2.23"}
veilway-proto={path="../veilway-proto", version="0.2.23"}
veilway-transport={path="../veilway-transport", version="0.2.23"}
tokio.workspace=true
tracing.workspace=true
anyhow.workspace=true
ipnet.workspace=true
# The utun control socket, the routing socket and the interface list: the only `unsafe` in the platform layer, each with its reason.
libc.workspace=true
# The socket option behind the hook that keeps the engine's sockets on the physical interface (`all` for the interface binding).
socket2={workspace=true, features=["all"]}
# The AEAD of the vault file, and the random bytes of its key.
ring.workspace=true

[target.'cfg(unix)'.dependencies]
# The lock on the run directory, the owner checks and signals to the running client, all in safe code.
rustix={workspace=true, features=["fs", "process"]}

[target.'cfg(target_os = "macos")'.dependencies]
# The system keychain, where the vault's key lives.
security-framework.workspace=true
