[package]
name="veilway"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
description="Veilway command line: run a node, check configs, diagnose, and connect as a client."
readme="README.md"
keywords=["vpn", "wireguard", "proxy", "cli", "censorship"]
categories=["command-line-utilities", "network-programming"]
exclude=["tests/", "examples/", "proptest-regressions/"]

[[bin]]
name="veilway"
path="src/main.rs"

[dependencies]
veilway-core={path="../veilway-core", version="0.2.18"}
veilway-wg={path="../veilway-wg", version="0.2.18"}
# The window and the step of the replay rule, which `doctor` holds a replay file against.
veilway-proto={path="../veilway-proto", version="0.2.18"}
tokio.workspace=true
anyhow.workspace=true
clap.workspace=true
tracing.workspace=true
tracing-subscriber.workspace=true
serde_json.workspace=true
# `doctor` reads the dates and the names of a certificate, which nothing else in the node looks at.
x509-parser.workspace=true
# `mirror`: the relay of a subscription endpoint. HTTPS to the panel with the chain always validated and the pins behind it, and the HMAC of the header that carries the client's address.
serde.workspace=true
ring.workspace=true
base64.workspace=true
rustls.workspace=true
tokio-rustls.workspace=true
webpki-roots.workspace=true
ipnet.workspace=true

[target.'cfg(unix)'.dependencies]
veilway-api={path="../veilway-api", version="0.2.18"}
# The one `access` call `doctor` asks the system with whether a directory can be written.
libc.workspace=true

[target.'cfg(target_os = "linux")'.dependencies]
# `connect`, `disconnect` and `status`: the client engine and its Linux layer.
veilway-linux={path="../veilway-linux", version="0.2.18"}
# Whether the client runs as root, which decides where it keeps its files.
rustix={workspace=true, features=["process"]}

[target.'cfg(target_os = "macos")'.dependencies]
# The same commands on macOS: the engine and its macOS layer, which only root can run.
veilway-macos={path="../veilway-macos", version="0.2.18"}
rustix={workspace=true, features=["process"]}

[target.'cfg(windows)'.dependencies]
# The same commands on Windows: the engine and its Windows layer.
veilway-windows={path="../veilway-windows", version="0.2.18"}

[target.'cfg(any(target_os = "linux", target_os = "macos", windows))'.dependencies]
veilway-engine={path="../veilway-engine", version="0.2.18"}
# The Xray add-on that `connect` runs a legacy profile through.
veilway-xray={path="../veilway-xray", version="0.2.18"}

[dev-dependencies]
rcgen.workspace=true
time.workspace=true
# The WireGuard peer and the packets of the shutdown test, which opens flows through the binary as it is shipped.
boringtun.workspace=true
etherparse.workspace=true
