[package]
name="veilway-windows"
version.workspace=true
edition.workspace=true
license.workspace=true
repository.workspace=true
description="Windows layer of the Veilway client: Wintun, IP Helper routes, WFP kill switch, NRPT DNS and DPAPI vault."
readme="README.md"
keywords=["vpn", "windows", "wintun", "wfp", "dpapi"]
categories=["network-programming", "os::windows-apis"]
exclude=["tests/", "examples/", "proptest-regressions/"]

[dependencies]
veilway-engine={path="../veilway-engine", version="0.1.0"}
veilway-proto={path="../veilway-proto", version="0.1.0"}
veilway-transport={path="../veilway-transport", version="0.1.0"}
tokio.workspace=true
tracing.workspace=true
anyhow.workspace=true
ipnet.workspace=true
# The socket option behind the hook that keeps the engine's sockets on the physical interface (`all` for the raw socket handle).
socket2={workspace=true, features=["all"]}

[target.'cfg(windows)'.dependencies]
# Wintun's DLL is loaded from a path, and its sessions are the TUN device.
wintun-bindings.workspace=true
# The IP Helper API (addresses, routes, change notifications), the Windows Filtering Platform, DPAPI and the named objects of the lock: the only `unsafe` in the platform layer, each with its reason.
windows-sys={workspace=true, features=["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Rpc", "Win32_Storage_FileSystem", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Networking_WinSock", "Win32_System_Com", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_UI_Shell"]}
