# cargo-deny policy for both lockfiles: the workspace and apps/desktop/src-tauri.
# CI runs the desktop check with --target x86_64-pc-windows-msvc because that is the only desktop target shipped so far.

[graph]
# Only the targets that get released. Crates that are never compiled for these are not checked.
targets = [
	"x86_64-unknown-linux-musl",
	"aarch64-unknown-linux-musl",
	"x86_64-pc-windows-msvc",
	"aarch64-apple-darwin",
	"x86_64-apple-darwin",
]
all-features = true

[advisories]
version = 2
yanked = "deny"
# Every entry needs a reason and a way out. Vulnerabilities are fixed, not listed here.
ignore = [
	{ id = "RUSTSEC-2025-0075", reason = "unic-char-range: unmaintained, no vulnerability. Dependency of tauri-utils through urlpattern, desktop app only, nothing to upgrade to. Remove when tauri drops it." },
	{ id = "RUSTSEC-2025-0080", reason = "unic-common: same tauri-utils -> urlpattern chain as RUSTSEC-2025-0075." },
	{ id = "RUSTSEC-2025-0081", reason = "unic-char-property: same tauri-utils -> urlpattern chain as RUSTSEC-2025-0075." },
	{ id = "RUSTSEC-2025-0098", reason = "unic-ucd-version: same tauri-utils -> urlpattern chain as RUSTSEC-2025-0075." },
	{ id = "RUSTSEC-2025-0100", reason = "unic-ucd-ident: same tauri-utils -> urlpattern chain as RUSTSEC-2025-0075." },
]

[licenses]
version = 2
confidence-threshold = 0.93
# Exactly what the two dependency trees use today. A new licence must be added here on purpose.
allow = [
	"Apache-2.0",
	"MIT",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"ISC",
	"Zlib",
	"Unicode-3.0",
	# webpki-roots: the Mozilla root certificate list, data rather than code.
	"CDLA-Permissive-2.0",
	# smoltcp: the userspace TCP of the tunnels.
	"0BSD",
]

# MPL-2.0 is file-level copyleft. It is accepted only for these unmodified desktop dependencies (all pulled in by tauri), not for the core.
[[licenses.exceptions]]
crate = "cssparser"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "cssparser-macros"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "selectors"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "dtoa-short"
allow = ["MPL-2.0"]

[[licenses.exceptions]]
crate = "option-ext"
allow = ["MPL-2.0"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies between our own crates carry no version requirement. This only applies to crates marked publish = false.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
