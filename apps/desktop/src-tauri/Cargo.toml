[package]
name="veilway-desktop"
version="0.1.0"
edition="2021"
license="Apache-2.0"
publish=false
repository="https://github.com/veilway-project/veilway"
description="Windows desktop client for Veilway"

# Standalone: the root workspace excludes this path so the Tauri crate keeps its own lockfile and profiles.
[workspace]

[build-dependencies]
tauri-build="2"

[dependencies]
veilway-client={path="../../../crates/veilway-client"}
tauri={version="2", features=["tray-icon"]}
tauri-plugin-single-instance="2"
tauri-plugin-updater="2"
tauri-plugin-process="2"
serde={version="1", features=["derive"]}
serde_json="1"
tokio={version="1", features=["sync", "time", "rt"]}
tracing="0.1"
tracing-subscriber={version="0.3", default-features=false, features=["registry", "std"]}

[profile.release]
opt-level="s"
lto=true
strip=true
