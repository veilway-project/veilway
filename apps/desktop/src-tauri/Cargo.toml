[package]
name="veilway-desktop"
version="0.1.0"
edition="2021"
license="Apache-2.0"
publish=false
repository="https://github.com/veilway-project/veilway"
description="Desktop client for Veilway"

# Standalone: the root workspace excludes this path so the Tauri crate keeps its own lockfile and profiles.
[workspace]

[build-dependencies]
tauri-build="2"

[dependencies]
veilway-engine={path="../../../crates/veilway-engine"}
veilway-proto={path="../../../crates/veilway-proto"}
tauri={version="2", features=["tray-icon"]}
tauri-plugin-single-instance="2"
tauri-plugin-updater="2"
tauri-plugin-process="2"
tauri-plugin-autostart="2"
tauri-plugin-opener="2"
serde={version="1", features=["derive"]}
serde_json="1"
tokio={version="1", features=["rt-multi-thread", "net", "io-util", "sync", "time", "macros"]}
tracing="0.1"
tracing-subscriber={version="0.3", default-features=false, features=["registry", "std"]}
anyhow="1"
base64="0.23"
ring="0.17"
ipnet={version="2", features=["serde"]}
# Pictures are read in the unprivileged app, with size limits, and only to find a QR code in them.
image={version="0.25", default-features=false, features=["png", "jpeg"]}
rqrr="0.11"

# The platform layer runs in the helper, which is this same binary started with --helper and elevated once (see helper.rs).
[target.'cfg(unix)'.dependencies]
libc="0.2.150"
# The helper opens the one folder of the user's that it reads from with openat, never following a link.
rustix={version="1", default-features=false, features=["std", "process", "fs"]}

[target.'cfg(target_os = "linux")'.dependencies]
veilway-linux={path="../../../crates/veilway-linux"}

[target.'cfg(target_os = "macos")'.dependencies]
veilway-macos={path="../../../crates/veilway-macos"}

[target.'cfg(windows)'.dependencies]
veilway-windows={path="../../../crates/veilway-windows"}
# ShellExecuteExW with runas for the one elevation prompt, and the pipe's access list for the helper.
windows-sys={version="0.61", features=["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_UI_Shell"]}

[dev-dependencies]
veilway-engine={path="../../../crates/veilway-engine", features=["unencrypted-vault", "testing"]}
qrcode={version="0.14", default-features=false}

[profile.release]
opt-level="s"
lto=true
strip=true
