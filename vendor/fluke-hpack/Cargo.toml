# veilway patch: the HPACK decoder returns an error for a dynamic table size update that is not at the start of a block, the Huffman table is built once, and a size update in the middle of a block no longer panics (the upstream `.ok().unwrap()`). Marked in `src/decoder.rs` and `src/huffman.rs`.
[package]
name = "veilway-hpack"
version = "0.3.1-veilway.1"
authors = [
    "Marko Lalic <marko.lalic@gmail.com>",
    "Amos Wenger <amos@bearcove.net>",
]
edition = "2021"

exclude = ["fixtures/*"]

description = "fluke-hpack 0.3.1 with the patches of the Veilway project: no panic on a cut-off size update, size updates only at the start of a block, the Huffman table built once"
repository = "https://github.com/veilway-project/veilway"
readme = "README.md"
license = "MIT"
keywords = ["hpack", "http2", "encoding", "decoding"]

# veilway patch: the examples in the doc comments were written for the upstream callback, which returned nothing.
[lib]
doctest = false

[features]
# these are really slow unless `cargo test --release` is used, so they're optional
interop-tests = []

[dev-dependencies]
serde = { version = "1.0.197", features = ["derive"] }
serde_json = "1.0.114"
hex = "0.4.3"
thiserror = "1.0.58"

[dependencies]
tracing = "0.1"
