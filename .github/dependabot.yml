# Weekly version updates, grouped so one pull request covers each ecosystem. Security updates come on their own as soon as an advisory is published.
version: 2
updates:
  - package-ecosystem: cargo
    directories: ["/", "/apps/desktop/src-tauri", "/fuzz"]
    schedule: {interval: weekly}
    groups: {cargo: {patterns: ["*"]}}
    open-pull-requests-limit: 5
  - package-ecosystem: npm
    directory: /packages/sdk
    schedule: {interval: weekly}
    groups: {npm: {patterns: ["*"]}}
    # openapi-typescript 7 accepts TypeScript 5 only (npm ci refuses 6), and TypeScript 7 drops the JavaScript API it uses; revisit when it supports newer ones.
    ignore: [{dependency-name: typescript, versions: [">=6"]}]
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    groups: {actions: {patterns: ["*"]}}
