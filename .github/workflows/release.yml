name: release
# Publishes on v* tags. Started by hand on main it runs the same builds without publishing, which also warms the caches a tag build reads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # The UI depends on veilway-ui by a path next to the repository, and checkout refuses a path outside the workspace, so it is moved up after the checkout.
      - uses: actions/checkout@v7
        with:
          repository: veilway-project/veilway-ui
          path: veilway-ui
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install veilway-ui's UI package
        shell: pwsh
        run: |
          Move-Item -Path veilway-ui -Destination ..
          npm ci --prefix ../veilway-ui/packages/i18n
          npm ci --prefix ../veilway-ui/packages/ui
      - name: Build the desktop UI
        shell: pwsh
        working-directory: apps/desktop/ui
        run: |
          npm ci
          npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: desktop
      - name: Fetch wintun
        shell: pwsh
        run: |
          $ver = "0.14.1"
          $sha = "07C256185D6EE3652E09FA55C0B673E2624B565E02C4B9091C79CA7D2F24EF51"
          Invoke-WebRequest -Uri "https://www.wintun.net/builds/wintun-$ver.zip" -OutFile wintun.zip
          $got = (Get-FileHash wintun.zip -Algorithm SHA256).Hash
          if ($got -ne $sha) { throw "wintun checksum mismatch: $got" }
          Expand-Archive wintun.zip -DestinationPath wintun-unpacked -Force
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/resources | Out-Null
          Copy-Item wintun-unpacked/wintun/bin/amd64/wintun.dll apps/desktop/src-tauri/resources/wintun.dll
      # With an empty tagName the action only builds and uploads nothing.
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop/src-tauri
          tauriScript: npx --yes @tauri-apps/cli@^2
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-musl, cross: true}
          - {os: ubuntu-latest, target: aarch64-unknown-linux-musl, cross: true}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, cross: false}
          - {os: macos-latest, target: aarch64-apple-darwin, cross: false}
          - {os: macos-latest, target: x86_64-apple-darwin, cross: false}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      # The musl builds use zig as the C compiler: BoringSSL's build script needs libclang, which a musl host cannot load, and the GCC in cross's images crashes on BoringSSL.
      - uses: taiki-e/install-action@v2
        if: matrix.cross
        with:
          tool: cargo-zigbuild
      - if: matrix.cross
        run: pip install --break-system-packages ziglang
      - name: Build
        shell: bash
        run: cargo ${{ matrix.cross && 'zigbuild' || 'build' }} --release --locked --target ${{ matrix.target }} -p veilway --bin veilway
      - name: Stage asset
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          ext=""
          [[ "$TARGET" == *windows* ]] && ext=".exe"
          mkdir -p dist
          cp "target/$TARGET/release/veilway$ext" "dist/veilway-$TARGET$ext"
      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: veilway-${{ matrix.target }}
          path: dist/*

  android:
    # The release-signed APK, attached to the release by the publish job.
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: veilway-project/veilway-ui
          path: veilway-ui
      - run: mv veilway-ui ..
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/android/src-tauri
      - uses: android-actions/setup-android@v3
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - run: npm install -g @tauri-apps/cli@2
      - name: Build the APK
        env:
          ROOT: ${{ github.workspace }}
          VEILWAY_UI_DIR: ${{ github.workspace }}/../veilway-ui
          SKIP_SDK: "1"
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
          VEILWAY_RELEASE: "1"
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: sh apps/android/scripts/build.sh
      - run: mv apps/android/dist/veilway-*-arm64.apk apps/android/dist/veilway-android-arm64.apk
      - uses: actions/upload-artifact@v7
        with:
          name: veilway-android-arm64
          path: apps/android/dist/veilway-android-arm64.apk

  publish:
    # Runs after the desktop and Android jobs so they do not race to create the release for the same tag.
    if: github.ref_type == 'tag' && !cancelled() && needs.build.result == 'success'
    needs: [build, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      # RELEASE_SIGNING_KEY holds the contents of an unencrypted minisign secret key file (minisign -G -W).
      # The trusted comment binds each signature to the tag and the asset name, so a signature cannot be reused for another file.
      - name: Sign assets
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [ -z "$RELEASE_SIGNING_KEY" ]; then
            echo "::warning::RELEASE_SIGNING_KEY is not set, skipping minisign: this release is published without .minisig files"
            exit 0
          fi
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q minisign
          umask 077
          trap 'rm -f "$RUNNER_TEMP/minisign.key"' EXIT
          printf "%s\n" "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in dist/*; do minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -t "veilway $REF_NAME $(basename "$f")" </dev/null; done
          echo "signed every asset in dist with minisign"
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
