name: ci
# Every push builds and tests on Linux, Windows and macOS: the repository is public, so the runners cost nothing.
on:
  push:
    paths-ignore: ["**.md", "LICENSE", "NOTICE", "licenses/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "NOTICE", "licenses/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # BoringSSL (the client's browser-like TLS hello, `veilway-transport`) is built from source: cmake and a C compiler are on the Linux and macOS runners, and on Windows it needs NASM and Ninja next to MSVC and cmake.
      - name: Tools for BoringSSL
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nasm ninja -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # macOS has only 127.0.0.1 on loopback; the tests dial from these as the addresses of separate visitors.
      - name: Alias the loopback addresses the tests use
        if: matrix.os == 'macos-latest'
        run: |
          for a in 127.0.1.1 $(seq -f "127.0.0.%g" 2 9) 127.0.0.77 $(seq -f "127.0.2.%g" 100 155); do sudo ifconfig lo0 alias $a up; done
      - run: cargo build --workspace --release
      # A shared runner sometimes starves a test that times real sockets. A test that failed runs once more on its own: one that passes then is named as flaky, one that fails again, a doc test or a build that failed fails the job.
      - name: Test
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log; [ "${PIPESTATUS[0]}" = 0 ] && exit 0
          failed=$(tr -d "\r" < test.log | sed -n "s/^test \(.*\) \.\.\. FAILED$/\1/p" | sort -u); [ -n "$failed" ] || exit 1
          while read -r t; do
            case "$t" in *" "*|*"("*) exit 1;; esac
            cargo test --workspace -- --exact "$t" 2>&1 | grep -q "^test $t \.\.\. ok" || { echo "::error::$t failed twice"; exit 1; }
            echo "::warning::$t is flaky: it failed once and passed on its own"
          done <<< "$failed"
      # The UI depends on veilway-ui by a path next to the repository, and checkout refuses a path outside the workspace, so it is moved up after the checkout.
      - uses: actions/checkout@v7
        if: matrix.os == 'windows-latest'
        with:
          repository: veilway-project/veilway-ui
          path: veilway-ui
      - uses: actions/setup-node@v7
        if: matrix.os == 'windows-latest'
        with:
          node-version: 22
      - name: Install veilway-ui's UI package
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Move-Item -Path veilway-ui -Destination ..
          npm ci --prefix ../veilway-ui/packages/i18n
          npm ci --prefix ../veilway-ui/packages/ui
      - name: Build the desktop UI
        if: matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: apps/desktop/ui
        run: |
          npm ci
          npm run build
      - name: Build the desktop app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/resources | Out-Null
          Set-Content -Path apps/desktop/src-tauri/resources/wintun.dll -Value "" # placeholder, this step only compiles
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml

  # The Android app as an arm64 APK, kept as an artifact for 14 days. Debug-signed on every push; a tag (v*) is a release build, signed with the release key from the secrets. The same script as the local Docker build (apps/android/scripts/build.sh), with the SDK installed by the runner.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: veilway-project/veilway-ui
          path: veilway-ui
      - run: mv veilway-ui ..
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/android/src-tauri
      - uses: android-actions/setup-android@v4
        with:
          packages: "platforms;android-35 build-tools;35.0.0 ndk;27.2.12479018"
      - run: npm install -g @tauri-apps/cli@2
      - name: Build the APK
        env:
          ROOT: ${{ github.workspace }}
          VEILWAY_UI_DIR: ${{ github.workspace }}/../veilway-ui
          SKIP_SDK: "1"
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: sh apps/android/scripts/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: veilway-android-arm64
          path: apps/android/dist/veilway-*-arm64.apk
          retention-days: 14

  # Licences, bans, advisories and sources for both lockfiles. The policy is deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Workspace
        run: cargo deny --locked check
      - name: Desktop app
        if: always()
        run: cargo deny --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --config deny.toml check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Workspace
        run: cargo audit --file Cargo.lock
      - name: Desktop app
        if: always()
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock

  # The Windows client on a real Windows runner, as an administrator: a test subscription whose node does not exist, what connect puts in force, the kill switch holding a request to the internet, and disconnect putting everything back. Only on ci/** branches and by hand, because it changes the network of the runner.
  windows-smoke:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/ci/'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Tools for BoringSSL
        shell: pwsh
        run: |
          choco install nasm ninja -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      - name: Build the client and install it with wintun.dll
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          "SMOKE=$env:RUNNER_TEMP\smoke" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
          cargo build -p veilway
          # The pinned release of apps/desktop/scripts/fetch-wintun.sh, with the same hash.
          $zip = "$env:RUNNER_TEMP\wintun.zip"
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.wintun.net/builds/wintun-0.14.1.zip" -OutFile $zip
          if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51") {Write-Output "::error::the wintun archive does not have the pinned hash"; exit 1}
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\wintun"
          $dll = Get-ChildItem "$env:RUNNER_TEMP\wintun" -Recurse -Filter wintun.dll | Where-Object {$_.FullName -match "bin.amd64"} | Select-Object -First 1
          if (-not $dll) {Write-Output "::error::bin/amd64/wintun.dll is not in the archive"; exit 1}
          # The client loads wintun.dll from the folder of veilway.exe, and as an administrator it refuses a folder that others can write in, so both go to Program Files.
          $install = Join-Path $env:ProgramFiles "Veilway"
          New-Item -ItemType Directory -Force -Path $install | Out-Null
          Copy-Item "target\debug\veilway.exe" $install
          Copy-Item $dll.FullName $install
      - name: Record the network state before the test
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          New-Item -ItemType Directory -Force -Path $env:SMOKE | Out-Null
          Get-NetIPInterface | Out-File "$env:SMOKE\before-interfaces.txt"
          Get-NetRoute -AddressFamily IPv4 | Out-File "$env:SMOKE\before-routes.txt"
          Get-DnsClientNrptRule | Out-File "$env:SMOKE\before-nrpt.txt"
          netsh wfp show filters "file=$env:SMOKE\before-wfp.xml" | Out-Null
          # The after-state is compared with this one, which is why it must not hold anything of the client's already.
          if (@(Get-DnsClientNrptRule | Where-Object Comment -eq "Veilway").Count -gt 0) {Write-Output "::error::a name rule of the client is in the table before the test"; exit 1}
          if ([regex]::Matches((Get-Content -Raw "$env:SMOKE\before-wfp.xml"), '(?i)<filterKey>\s*\{56570000-0000-4000-8000-').Count -gt 0) {Write-Output "::error::kill switch filters of the client are in force before the test"; exit 1}
          Get-NetRoute -AddressFamily IPv4 | Where-Object InterfaceAlias -ne "Veilway" | ForEach-Object {"$($_.DestinationPrefix) $($_.InterfaceAlias) $($_.NextHop) $($_.RouteMetric)"} | Sort-Object -Unique | Set-Content "$env:SMOKE\before-routes-set.txt"
          try {$null = Invoke-WebRequest -UseBasicParsing -Uri "https://www.example.com" -TimeoutSec 20} catch {Write-Output "::error::the internet is not reachable before the test: $($_.Exception.Message)"; exit 1}
      - name: Make a test subscription
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          cargo build -p veilway --example smoke_subscription
          & "target\debug\examples\smoke_subscription.exe" "$env:SMOKE\smoke.vwsub"
      - name: Connect and check what is in force
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          # The client asks yes or no on the terminal. The answers come from a file, so that every question is answered yes.
          @("yes") * 10 | Set-Content "$env:SMOKE\answers.txt"
          Start-Process -FilePath "$env:ProgramFiles\Veilway\veilway.exe" -ArgumentList "connect", "$env:SMOKE\smoke.vwsub" -RedirectStandardInput "$env:SMOKE\answers.txt" -RedirectStandardOutput "$env:SMOKE\connect-out.txt" -RedirectStandardError "$env:SMOKE\connect.log" -WindowStyle Hidden
          $until = (Get-Date).AddSeconds(30)
          do {
            Start-Sleep -Seconds 1
            $adapter = Get-NetAdapter -Name "Veilway" -ErrorAction SilentlyContinue
            $routes = @(Get-NetRoute -InterfaceAlias "Veilway" -AddressFamily IPv4 -ErrorAction SilentlyContinue | Where-Object DestinationPrefix -in "0.0.0.0/1", "128.0.0.0/1")
            $rules = @(Get-DnsClientNrptRule | Where-Object Comment -eq "Veilway")
          } until (($adapter.Status -eq "Up" -and $routes.Count -eq 2 -and $rules.Count -gt 0) -or (Get-Date) -gt $until)
          if (-not (Get-Process -Name veilway -ErrorAction SilentlyContinue)) {Write-Output "::error::veilway connect ended before the connection was up, see connect.log"; exit 1}
          if (-not $adapter -or $adapter.Status -ne "Up") {Write-Output "::error::the Veilway adapter is not up after 30 s"; exit 1}
          if ($routes.Count -ne 2) {Write-Output "::error::the tunnel routes 0.0.0.0/1 and 128.0.0.0/1 are not both in the table"; exit 1}
          if (-not ($rules | Where-Object {$_.Namespace -contains "."})) {Write-Output "::error::the name rule of the client is not a catch-all"; exit 1}
          netsh wfp show filters "file=$env:SMOKE\connected-wfp.xml" | Out-Null
          if ([regex]::Matches((Get-Content -Raw "$env:SMOKE\connected-wfp.xml"), '(?i)<filterKey>\s*\{56570000-0000-4000-8000-').Count -eq 0) {Write-Output "::error::no kill switch filter is in force while connected"; exit 1}
          # The node does not exist, so nothing may leave the device outside the tunnel.
          try {$null = Invoke-WebRequest -UseBasicParsing -Uri "https://www.example.com" -TimeoutSec 8} catch {Write-Output "The request was held: $($_.Exception.Message)"; $held = $true}
          if (-not $held) {Write-Output "::error::www.example.com answered while the node is unreachable: the kill switch leaks"; exit 1}
          $status = & "$env:ProgramFiles\Veilway\veilway.exe" status
          $status
          if (-not $status -or ($status -join " ") -match "Not connected") {Write-Output "::error::veilway status does not report a connection"; exit 1}
      - name: Disconnect and check that everything is back
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          & "$env:ProgramFiles\Veilway\veilway.exe" disconnect
          $until = (Get-Date).AddSeconds(30)
          while ((Get-Process -Name veilway -ErrorAction SilentlyContinue) -and (Get-Date) -lt $until) {Start-Sleep -Seconds 1}
          if (Get-Process -Name veilway -ErrorAction SilentlyContinue) {Write-Output "::error::veilway is still running 30 s after disconnect"; exit 1}
          Get-NetIPInterface | Out-File "$env:SMOKE\after-interfaces.txt"
          Get-NetRoute -AddressFamily IPv4 | Out-File "$env:SMOKE\after-routes.txt"
          Get-DnsClientNrptRule | Out-File "$env:SMOKE\after-nrpt.txt"
          netsh wfp show filters "file=$env:SMOKE\after-wfp.xml" | Out-Null
          $adapter = Get-NetAdapter -Name "Veilway" -ErrorAction SilentlyContinue
          if ($adapter -and $adapter.Status -eq "Up") {Write-Output "::error::the Veilway adapter is still up"; exit 1}
          if (@(Get-NetRoute -InterfaceAlias "Veilway" -ErrorAction SilentlyContinue).Count -gt 0) {Write-Output "::error::routes into the Veilway adapter are still in the table"; exit 1}
          if (@(Get-DnsClientNrptRule | Where-Object Comment -eq "Veilway").Count -gt 0) {Write-Output "::error::the client's name rule is still in the table"; exit 1}
          if ([regex]::Matches((Get-Content -Raw "$env:SMOKE\after-wfp.xml"), '(?i)<filterKey>\s*\{56570000-0000-4000-8000-').Count -gt 0) {Write-Output "::error::kill switch filters are still in force"; exit 1}
          $routes = Get-NetRoute -AddressFamily IPv4 | Where-Object InterfaceAlias -ne "Veilway" | ForEach-Object {"$($_.DestinationPrefix) $($_.InterfaceAlias) $($_.NextHop) $($_.RouteMetric)"} | Sort-Object -Unique
          if (Compare-Object (Get-Content "$env:SMOKE\before-routes-set.txt") $routes) {Write-Output "::error::the routes of the other adapters differ from before the connection"; exit 1}
          try {$null = Invoke-WebRequest -UseBasicParsing -Uri "https://www.example.com" -TimeoutSec 20} catch {Write-Output "::error::the internet is not reachable after disconnect: $($_.Exception.Message)"; exit 1}
      - name: Stop the client after a failed check
        if: failure()
        shell: pwsh
        continue-on-error: true
        run: |
          # The kill switch holds the runner's own traffic too, so the logs cannot be uploaded while it is in force.
          & "$env:ProgramFiles\Veilway\veilway.exe" disconnect
      - name: Upload the dumps and the client log
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: windows-smoke
          path: ${{ runner.temp }}\smoke
          retention-days: 14
