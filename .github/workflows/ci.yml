name: ci
# Every push builds and tests on Linux, Windows and macOS: the repository is public, so the runners cost nothing.
on:
  push:
    paths-ignore: ["**.md", "LICENSE", "NOTICE", "licenses/**"]
  pull_request:
    paths-ignore: ["**.md", "LICENSE", "NOTICE", "licenses/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # BoringSSL (the client's browser-like TLS hello, `veilway-transport`) is built from source: cmake and a C compiler are on the Linux and macOS runners, and on Windows it needs NASM and Ninja next to MSVC and cmake.
      - name: Tools for BoringSSL
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          choco install nasm ninja -y --no-progress
          "C:\Program Files\NASM" | Out-File -Append -Encoding utf8 $env:GITHUB_PATH
      # macOS has only 127.0.0.1 on loopback; the tests dial from these as the addresses of separate visitors.
      - name: Alias the loopback addresses the tests use
        if: matrix.os == 'macos-latest'
        run: |
          for a in 127.0.1.1 $(seq -f "127.0.0.%g" 2 9) 127.0.0.77 $(seq -f "127.0.2.%g" 100 155); do sudo ifconfig lo0 alias $a up; done
      - run: cargo build --workspace --release
      # A shared runner sometimes starves a test that times real sockets. A test that failed runs once more on its own: one that passes then is named as flaky, one that fails again, a doc test or a build that failed fails the job.
      - name: Test
        shell: bash
        run: |
          set +e
          cargo test --workspace --no-fail-fast 2>&1 | tee test.log; [ "${PIPESTATUS[0]}" = 0 ] && exit 0
          failed=$(tr -d "\r" < test.log | sed -n "s/^test \(.*\) \.\.\. FAILED$/\1/p" | sort -u); [ -n "$failed" ] || exit 1
          while read -r t; do
            case "$t" in *" "*|*"("*) exit 1;; esac
            cargo test --workspace -- --exact "$t" 2>&1 | grep -q "^test $t \.\.\. ok" || { echo "::error::$t failed twice"; exit 1; }
            echo "::warning::$t is flaky: it failed once and passed on its own"
          done <<< "$failed"
      - name: Build the desktop app
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path apps/desktop/src-tauri/resources | Out-Null
          Set-Content -Path apps/desktop/src-tauri/resources/wintun.dll -Value "" # placeholder, this step only compiles
          cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml

  # Licences, bans, advisories and sources for both lockfiles. The policy is deny.toml.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      - name: Workspace
        run: cargo deny --locked check
      - name: Desktop app
        if: always()
        run: cargo deny --locked --manifest-path apps/desktop/src-tauri/Cargo.toml --target x86_64-pc-windows-msvc --config deny.toml check

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: Workspace
        run: cargo audit --file Cargo.lock
      - name: Desktop app
        if: always()
        run: cargo audit --file apps/desktop/src-tauri/Cargo.lock
