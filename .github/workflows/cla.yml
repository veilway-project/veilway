name: cla
# Every contributor signs CLA.md once, by posting the sentence below on their first pull request.
# pull_request_target gives this job a write token on pull requests from forks. That is safe only because nothing here checks out or runs pull request code. Keep it that way.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    steps:
      # Pinned by commit because this job holds a write token. The upstream repository is archived; move to a maintained fork before runners drop node20.
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/veilway-project/veilway/blob/main/CLA.md
          # Signatures live in this repository on their own branch. It must exist and must not be protected.
          branch: cla-signatures
          path-to-signatures: signatures/cla.json
          allowlist: dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: Thank you for the contribution. Before it can be merged, please read the [Contributor License Agreement](https://github.com/veilway-project/veilway/blob/main/CLA.md) and sign it by posting the comment below. You only do this once.
          custom-allsigned-prcomment: All contributors have signed the CLA.
          signed-commit-message: $contributorName signed the CLA in $owner/$repo#$pullRequestNo
          create-file-commit-message: Create the CLA signature file
