name: desktop-linux
# The desktop app for Linux as .deb and .rpm, attached to a release and signed with the release key.
# Runs on v* tags (it waits for the release the release workflow makes) and by hand for a tag that already has a release.
# No AppImage: the helper only runs from root-owned folders, and Tauri's updater on Linux needs an AppImage, so these packages update by installing a newer one.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag of an existing release"
        required: true

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-22.04, arch: x86_64}
          - {os: ubuntu-22.04-arm, arch: aarch64}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/checkout@v7
        with:
          repository: veilway-project/veilway-ui
          path: veilway-ui
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: System packages
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev cmake clang libclang-dev perl minisign rpm
      - name: Build the desktop UI
        run: |
          mv veilway-ui ..
          npm ci --prefix ../veilway-ui/packages/i18n
          npm ci --prefix ../veilway-ui/packages/ui
          cd apps/desktop/ui && npm ci && npm run build
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri
          key: desktop-linux-${{ matrix.arch }}
      - name: Build the packages
        working-directory: apps/desktop/src-tauri
        run: npx --yes @tauri-apps/cli@^2 build --bundles deb,rpm
      - name: Wait for the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for _ in $(seq 120); do gh release view "$TAG" >/dev/null 2>&1 && exit 0; sleep 30; done
          echo "::error::no release for $TAG after an hour"; exit 1
      - name: Sign and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for f in apps/desktop/src-tauri/target/release/bundle/deb/*.deb apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm; do cp "$f" dist/; done
          umask 077
          trap 'rm -f "$RUNNER_TEMP/minisign.key"' EXIT
          printf "%s\n" "$RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/minisign.key"
          for f in dist/*; do minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$f" -t "veilway $TAG $(basename "$f")" </dev/null; done
          gh release upload "$TAG" dist/* --clobber
