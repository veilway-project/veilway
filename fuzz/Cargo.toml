[package]
name="veilway-fuzz"
version="0.0.0"
edition="2021"
publish=false

[package.metadata]
cargo-fuzz=true

[dependencies]
libfuzzer-sys="0.4"
serde_json="1"
veilway-core={path="../crates/veilway-core"}
veilway-proto={path="../crates/veilway-proto"}
# The chunk target seals plaintexts itself, with the library the crate opens them with.
ring="0.17"

[[bin]]
name="config"
path="fuzz_targets/config.rs"
test=false
doc=false
bench=false

[[bin]]
name="packet"
path="fuzz_targets/packet.rs"
test=false
doc=false
bench=false

[[bin]]
name="dns"
path="fuzz_targets/dns.rs"
test=false
doc=false
bench=false

[[bin]]
name="chunk"
path="fuzz_targets/chunk.rs"
test=false
doc=false
bench=false

[[bin]]
name="control_stream"
path="fuzz_targets/control_stream.rs"
test=false
doc=false
bench=false

[[bin]]
name="fuzz_control_server"
path="fuzz_targets/fuzz_control_server.rs"
test=false
doc=false
bench=false

[[bin]]
name="fuzz_control_client"
path="fuzz_targets/fuzz_control_client.rs"
test=false
doc=false
bench=false

# Not part of the main workspace.
[workspace]

# Same patch as the root manifest, so the fuzzed build matches the real one.
[patch.crates-io]
ipstack={path="../vendor/ipstack"}
