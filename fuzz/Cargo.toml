[package]
name="veilway-fuzz"
version="0.0.0"
edition="2021"
publish=false

[package.metadata]
cargo-fuzz=true

[dependencies]
libfuzzer-sys="0.4"
serde_json="1"
veilway-core={path="../crates/veilway-core", features=["bench"]}
# The engine_* targets drive what the client engine reads from a file and from the node.
veilway-engine={path="../crates/veilway-engine", features=["fuzz"]}
veilway-proto={path="../crates/veilway-proto"}
# The faketls_hello target seals a real hello with the public half of the client's share.
x25519-dalek={version="3", default-features=false}
# The client_* targets drive what the client's side of the transports reads from the network.
veilway-transport={path="../crates/veilway-transport"}
# The linux_netlink target drives what the Linux layer reads from the kernel.
veilway-linux={path="../crates/veilway-linux"}
# The obfs_listener target drives real WireGuard peers against the node's listener.
veilway-wg={path="../crates/veilway-wg"}
# The chunk target seals plaintexts itself, with the library the crate opens them with, and the subscription targets sign documents with it.
ring="0.17"
# The tls_listener target runs the node's own connection tasks over pipes in memory, and gives the node a clock of its own. The targets of the proxy path pause the runtime's clock, so that a hold time, a head that never ends and five quiet minutes cost them nothing.
tokio={version="1", features=["rt", "io-util", "time", "test-util"]}
time="0.3"

