[workspace]
resolver="2"
members=["crates/veilway-wg", "crates/veilway-proto", "crates/veilway-transport", "crates/veilway-engine", "crates/veilway-linux", "crates/veilway-windows", "crates/veilway-macos","crates/veilway-core", "crates/veilway-api", "crates/veilway-xray", "crates/veilway-client", "crates/veilway-ffi", "crates/veilway"]
exclude=["apps/desktop/src-tauri", "fuzz"]

[workspace.package]
version="0.2.20"
edition="2021"
license="Apache-2.0"
repository="https://github.com/veilway-project/veilway"

[workspace.dependencies]
tokio={version="1", features=["full"]}
anyhow="1"
serde={version="1", features=["derive"]}
serde_json="1"
clap={version="4", features=["derive"]}
tracing="0.1"
tracing-subscriber={version="0.3", features=["env-filter"]}
futures-util={version="0.3", default-features=false, features=["sink"]}
# Only the rustls connector, no root store of its own: the ws client passes one built from webpki-roots 1, so the deprecated webpki-roots 0.26 shim is never pulled in.
tokio-tungstenite={version="0.30", features=["__rustls-tls"]}
tokio-rustls={version="0.26", default-features=false, features=["ring", "tls12"]}
rustls={version="0.23", default-features=false, features=["ring", "std", "tls12", "logging"]}
rcgen="0.14"
x509-parser="0.18"
boringtun={version="0.7", default-features=false}
ipstack={package="veilway-ipstack", version="1.0.1-veilway.1", path="vendor/ipstack"}
ipnet={version="2", features=["serde"]}
base64="0.23"
rand_core={version="0.6", features=["getrandom"]}
etherparse="0.21"
# The userspace TCP of a tunnel (node links page, "Tunnels"): the entry opens its own connection inside the link with it. Only the TCP socket over IP packets, no device, no ARP, no DHCP.
smoltcp={version="0.12", default-features=false, features=["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"]}
wintun-bindings="0.7"
windows-sys="0.61"
security-framework="3"
schemars="1"
time={version="0.3.36", default-features=false, features=["std", "parsing", "formatting"]}
ring="0.17"
# `all` for binding a socket to a network interface by name (`bind_device`, `bind_device_by_index_v4`).
socket2={version="0.6", features=["all"]}
libc="0.2.150"
# Only `net` is used. `time` is there because rustix 1.1 does not build its socket options without the time types that feature brings.
rustix={version="1", default-features=false, features=["std", "net", "time"]}
axum={version="0.8", default-features=false, features=["http1", "tokio"]}
hyper={version="1", features=["http1", "server"]}
hyper-util={version="0.1", features=["tokio", "service"]}
http-body-util="0.1"
proptest={version="1", default-features=false, features=["std"]}
# HPKE (RFC 9180) for the stream proof, from a library so that nothing of it is written here. Pinned to the exact version whose output is checked against the RFC's vectors in veilway-proto: 0.14 is the maintained line, and a new version is a decision, not an update. It has had no paid audit, and it brings a second curve25519 and a second ChaCha20-Poly1305 next to the ones boringtun and ring already bring.
hpke={version="=0.14.1", default-features=false, features=["x25519", "chacha"]}
subtle={version="2.6", default-features=false}
# X25519 for the one key agreement of node link pairing, as a plain function over bytes the caller drew. It is the version `hpke` brings already, and no feature of it is on.
x25519-dalek={version="3", default-features=false}
# The Mozilla root certificates, which the TLS of a node link's dialler and of the ws client is validated against.
webpki-roots="1"
# The archive of the Xray-core add-on: one entry is read out of it, inflated under a cap. Only deflate with the pure Rust zlib-rs backend is on, so no encryption, bzip2, zstd, xz or time code comes in, and the archives are checked against a pin before they are opened.
zip={version="9.0", default-features=false, features=["deflate-flate2-zlib-rs"]}
# HPACK (RFC 7541) for the HTTP/2 of the stream transports: the Huffman table and the dynamic table, as a function over header blocks. The frames, their order and every limit are written in `veilway-proto`'s `h2`. It depends on `tracing` alone. Vendored in `vendor/fluke-hpack` with local patches, each marked there.
fluke-hpack={package="veilway-hpack", version="0.3.1-veilway.1", path="vendor/fluke-hpack"}
# ML-KEM-768 for the hybrid group X25519MLKEM768 of `faketls`, from the BoringSSL the client's hello is already made with (`boring`'s own bindings, which list `mlkem.h`), called in one module of `veilway-transport` with two functions each way. rustls' aws-lc-rs provider was the other way: it would bring a second crypto library (aws-lc-sys, a C build of its own) next to `ring` and BoringSSL for a listener that writes its own handshake and so would use only its ML-KEM, and the node needs no TLS library for this listener at all. The library's generated bindings are not wrapped by `boring`, so this is the same crate at the same version, and `cargo deny` sees no new package.
boring-sys="5.3"
# Wipes the secrets of the `faketls` handshake (the key agreement results, the traffic secrets, the ML-KEM private key) when they are done with. It is a crate the tree already has (argon2, hpke and the RustCrypto crates bring it), so `cargo deny` sees no new package, and it is what those crates wipe their own keys with.
zeroize="1"
# P-256 arithmetic for the leaf key of `faketls` in `veilway-proto`, the scalar times the generator and nothing else. Pure Rust (RustCrypto).
p256={version="0.13", default-features=false, features=["arithmetic"]}
# Argon2id for the sealed subscription file, as a plain function over bytes the caller drew. Pure Rust, no features beyond heap memory.
argon2={version="0.5", default-features=false, features=["alloc"]}


# Argon2 at 64 MiB and three passes is too slow unoptimized for the tests that open a sealed file.
[profile.dev.package.argon2]
opt-level=3
