[workspace]
resolver="2"
members=["crates/veilway-wg", "crates/veilway-proto", "crates/veilway-transport", "crates/veilway-engine", "crates/veilway-linux", "crates/veilway-windows", "crates/veilway-macos","crates/veilway-core", "crates/veilway-api", "crates/veilway-xray", "crates/veilway-client", "crates/veilway-ffi", "crates/veilway"]
exclude=["apps/desktop/src-tauri", "fuzz"]

[workspace.package]
version="0.1.0"
edition="2021"
license="Apache-2.0"
publish=false
repository="https://github.com/veilway-project/veilway"

[workspace.dependencies]
tokio={version="1", features=["full"]}
anyhow="1"
serde={version="1", features=["derive"]}
serde_json="1"
clap={version="4", features=["derive"]}
tracing="0.1"
tracing-subscriber={version="0.3", features=["env-filter"]}
futures-util={version="0.3", default-features=false, features=["sink"]}
tokio-tungstenite={version="0.30", features=["rustls-tls-webpki-roots"]}
tokio-rustls={version="0.26", default-features=false, features=["ring", "tls12"]}
rustls={version="0.23", default-features=false, features=["ring", "std", "tls12", "logging"]}
rcgen="0.14"
x509-parser="0.18"
boringtun={version="0.7", default-features=false}
ipstack="1"
tokio-socks="0.5"
ipnet={version="2", features=["serde"]}
base64="0.23"
rand_core={version="0.6", features=["getrandom"]}
etherparse="0.21"
wintun-bindings="0.7"
windows-sys="0.61"
security-framework="3"
schemars="1"
time={version="0.3.36", default-features=false, features=["std", "parsing", "formatting"]}
ring="0.17"
socket2="0.6"
libc="0.2.150"
# Only `net` is used. `time` is there because rustix 1.1 does not build its socket options without the time types that feature brings.
rustix={version="1", default-features=false, features=["std", "net", "time"]}
axum={version="0.8", default-features=false, features=["http1", "tokio"]}
hyper={version="1", features=["http1", "server"]}
hyper-util={version="0.1", features=["tokio", "service"]}
http-body-util="0.1"
proptest={version="1", default-features=false, features=["std"]}
# HPKE (RFC 9180) for the stream proof, from a library so that nothing of it is written here. Pinned to the exact version whose output is checked against the RFC's vectors in veilway-proto: 0.14 is the maintained line, and a new version is a decision, not an update. It has had no paid audit, and it brings a second curve25519 and a second ChaCha20-Poly1305 next to the ones boringtun and ring already bring.
hpke={version="=0.14.1", default-features=false, features=["x25519", "chacha"]}
subtle={version="2.6", default-features=false}
# X25519 for the one key agreement of node link pairing, as a plain function over bytes the caller drew. It is the version `hpke` brings already, and no feature of it is on.
x25519-dalek={version="3", default-features=false}
# The Mozilla root certificates, which the TLS of a node link's dialler is validated against. `tokio-tungstenite` brings the same crate already.
webpki-roots="1"


# ipstack 1.0.1 never reports EOF after the peer FIN, so relays hang until the idle timeout, and it blocks in the Drop of a TCP stream, which kept a node with open flows from ever exiting. See vendor/ipstack ("veilway patch").
[patch.crates-io]
ipstack={path="vendor/ipstack"}
